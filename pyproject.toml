[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pptx-wiki"
version = "0.2.0"
description = "Structure-first PPTX parsing, grounded semantic reorganisation, and deterministic Wiki publishing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "lxml>=5.2",
  "Pillow>=10.3",
  "python-pptx>=1.0.2",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
api = ["httpx>=0.27"]
windows = ["pywin32>=310; platform_system == 'Windows'"]
dev = ["pytest>=8.2"]

[project.scripts]
pptx-wiki = "pptx_wiki.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pptx_wiki"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
